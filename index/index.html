<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torque Audit System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">⚙️ TORQUE AUDIT WEB SYSTEM</h1>
            <div class="text-sm bg-slate-700 px-3 py-1 rounded">
                User: <span class="font-semibold text-emerald-400">Auditor Account</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- AUDIT ENTRY FORM -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">📋 Live Audit Data Entry</h2>
            
            <form id="auditForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Date & Time (Auto)</label>
                    <input type="text" id="dateTime" class="w-full bg-gray-100 border p-2 rounded cursor-not-allowed text-gray-600" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Shift</label>
                    <input type="text" id="shift" class="w-full bg-gray-100 border p-2 rounded font-bold text-blue-600 cursor-not-allowed" readonly>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Assembly Line *</label>
                    <select id="line" class="w-full border p-2 rounded focus:ring-2 focus:ring-slate-500" required>
                        <option value="">-- Choose Line --</option>
                        <option value="Line 1">Line 1</option>
                        <option value="Line 2">Line 2</option>
                        <option value="Line 3">Line 3</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Product Model *</label>
                    <select id="model" class="w-full border p-2 rounded focus:ring-2 focus:ring-slate-500" required>
                        <option value="">-- Choose Model --</option>
                        <option value="Model A">Model A</option>
                        <option value="Model B">Model B</option>
                    </select>
                </div>

                <div class="md:col-span-2 bg-slate-50 p-3 rounded border border-dashed border-slate-300">
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Part Scanner / Entry</label>
                    <div class="flex gap-2">
                        <input type="text" id="partCode" placeholder="Type part code (e.g., P101 or P102) and click fetch" class="flex-1 border p-2 rounded uppercase font-mono">
                        <button type="button" id="fetchPart" class="bg-slate-700 text-white px-4 py-2 rounded hover:bg-slate-800 transition">🔍 Fetch Data</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Part Name</label>
                    <input type="text" id="partName" class="w-full bg-gray-100 border p-2 rounded cursor-not-allowed text-gray-600" readonly placeholder="Awaiting Fetch">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Auditor Identity (Email)</label>
                    <input type="email" id="auditor" value="operator@factory.com" class="w-full border p-2 rounded" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Spec Min (Nm)</label>
                    <input type="number" id="specMin" class="w-full bg-gray-100 border p-2 rounded cursor-not-allowed" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Spec Max (Nm)</label>
                    <input type="number" id="specMax" class="w-full bg-gray-100 border p-2 rounded cursor-not-allowed" readonly>
                </div>

                <div class="md:col-span-2 grid grid-cols-3 gap-2 bg-blue-50 p-3 rounded border border-blue-100">
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 1</label>
                        <input type="number" step="0.01" id="r1" class="reading-input w-full border p-2 rounded bg-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 2</label>
                        <input type="number" step="0.01" id="r2" class="reading-input w-full border p-2 rounded bg-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 3</label>
                        <input type="number" step="0.01" id="r3" class="reading-input w-full border p-2 rounded bg-white" required>
                    </div>
                </div>

                <div class="md:col-span-2 p-4 rounded-xl text-center font-black text-2xl bg-gray-200 text-gray-600 transition" id="resultBox">
                    STATUS: <span id="resultVal">AWAITING READINGS</span>
                </div>

                <div class="md:col-span-2 text-right">
                    <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white font-bold px-8 py-3 rounded-lg shadow hover:bg-emerald-700 transition">🚀 Submit to Google Sheet</button>
                </div>
            </form>
        </div>

        <!-- LIVE CALIBRATION DISPLAY MODULE -->
        <div class="space-y-6">
            <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">🔧 Calibration Monitor</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between items-center p-2 bg-emerald-50 rounded text-emerald-800">
                        <span>Digital Wrench #01</span>
                        <span class="text-xs font-bold bg-emerald-200 px-2 py-0.5 rounded">PASSED</span>
                    </div>
                    <div class="flex justify-between items-center p-2 bg-red-50 rounded text-red-800 font-medium">
                        <span>Click Wrench #04</span>
                        <span class="text-xs font-bold bg-red-200 px-2 py-0.5 rounded animate-pulse">OVERDUE ALERT</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURATION: PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = https://script.google.com/macros/s/AKfycbwjFvkYgMjHfqifJwOx-S3Q2vxz9npR3DafwZELAXa8kTMntqPVA7SKkfElz7XGBl2c/exec;

        let partMasterData = {};

        // Track live shifts based on local hours
        function runClockAndShift() {
            const current = new Date();
            document.getElementById('dateTime').value = current.toLocaleString();
            const hrs = current.getHours();
            document.getElementById('shift').value = (hrs < 12) ? "Morning Shift" : (hrs < 18) ? "Afternoon Shift" : "Night Shift";
        }
        setInterval(runClockAndShift, 1000);
        runClockAndShift();

        // Download real-time master data specifications directly from Google Sheets
        async function fetchMasterParts() {
            if(API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;
            try {
                const response = await fetch(API_URL);
                partMasterData = await response.json();
                console.log("Database parameters synchronized successfully.", partMasterData);
            } catch (e) {
                console.error("Master data syncing failed", e);
            }
        }
        fetchMasterParts();

        // Local barcode lookup emulation
        document.getElementById('fetchPart').addEventListener('click', () => {
            const code = document.getElementById('partCode').value.toUpperCase().trim();
            const record = partMasterData[code];
            if (record) {
                document.getElementById('partName').value = record.name;
                document.getElementById('specMin').value = record.min;
                document.getElementById('specMax').value = record.max;
                runEvaluation();
            } else {
                alert("Part item code data wasn't found inside Google Sheets 'Part_Master'. Try updating the database.");
            }
        });

        // Dynamic Calculations
        const inputs = document.querySelectorAll('.reading-input');
        inputs.forEach(elm => elm.addEventListener('input', runEvaluation));

        function runEvaluation() {
            const min = parseFloat(document.getElementById('specMin').value);
            const max = parseFloat(document.getElementById('specMax').value);
            const r1 = parseFloat(document.getElementById('r1').value);
            const r2 = parseFloat(document.getElementById('r2').value);
            const r3 = parseFloat(document.getElementById('r3').value);

            const box = document.getElementById('resultBox');
            const output = document.getElementById('resultVal');

            if (isNaN(min) || isNaN(max) || isNaN(r1) || isNaN(r2) || isNaN(r3)) {
                box.className = "md:col-span-2 p-4 rounded-xl text-center font-black text-2xl bg-gray-200 text-gray-600";
                output.innerText = "AWAITING READINGS";
                return "";
            }

            if (r1 >= min && r1 <= max && r2 >= min && r2 <= max && r3 >= min && r3 <= max) {
                box.className = "md:col-span-2 p-4 rounded-xl text-center font-black text-2xl bg-emerald-500 text-white shadow-md";
                output.innerText = "OK";
                return "OK";
            } else {
                box.className = "md:col-span-2 p-4 rounded-xl text-center font-black text-2xl bg-red-600 text-white shadow-md animate-pulse";
                output.innerText = "NG (FAIL)";
                return "NG";
            }
        }

        // Web Form Submission Handling directly to Sheet database API
        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const finalResult = runEvaluation();
            if(!finalResult) { alert("Complete parameters first"); return;}
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing Data Base Transfer...";
            btn.disabled = true;

            const payload = {
                line: document.getElementById('line').value,
                model: document.getElementById('model').value,
                partCode: document.getElementById('partCode').value.toUpperCase().trim(),
                partName: document.getElementById('partName').value,
                specMin: document.getElementById('specMin').value,
                specMax: document.getElementById('specMax').value,
                r1: document.getElementById('r1').value,
                r2: document.getElementById('r2').value,
                r3: document.getElementById('r3').value,
                result: finalResult,
                auditor: document.getElementById('auditor').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Solves cors blocks across domains
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("Data recorded into Google Sheets successfully!");
                document.getElementById('auditForm').reset();
                runEvaluation();
            } catch(err) {
                alert("Data save error pipeline broken. See Console logs.");
                console.error(err);
            } finally {
                btn.innerText = "🚀 Submit to Google Sheet";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
