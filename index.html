<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Torque Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 font-sans min-h-screen p-2 md:p-6">

    <main class="max-w-4xl mx-auto space-y-6">
        
        <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 border-t-8 border-blue-800">
            <h2 class="text-xl font-black text-gray-800 mb-4 uppercase border-b pb-2">Torque Verification Audit</h2>
            
            <form id="auditForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Date & Time</label>
                    <input type="datetime-local" id="dateTime" class="w-full border-2 border-gray-300 p-2 rounded focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Shift</label>
                    <input type="text" id="shift" placeholder="e.g., A, B, Morning" class="w-full border-2 border-gray-300 p-2 rounded focus:border-blue-500" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Section / Line</label>
                    <input type="text" id="line" placeholder="e.g., Frame Assembly" class="w-full border-2 border-gray-300 p-2 rounded focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Auditor Name</label>
                    <input type="text" id="auditor" placeholder="Enter full name" class="w-full border-2 border-gray-300 p-2 rounded focus:border-blue-500" required>
                </div>

                <div class="md:col-span-2 bg-slate-50 p-3 rounded border border-slate-300 mt-2">
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Part Description</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="partCode" placeholder="Optional: Part Code for auto-fetch" class="flex-1 border p-2 rounded">
                        <button type="button" id="fetchPart" class="bg-slate-700 text-white px-4 py-2 rounded font-bold hover:bg-slate-800">Fetch</button>
                    </div>
                    <input type="text" id="partName" placeholder="Description (e.g., Side stand Bolt)" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Spec Min (Kgf.cm)</label>
                    <input type="number" id="specMin" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Spec Max (Kgf.cm)</label>
                    <input type="number" id="specMax" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>

                <div class="md:col-span-2 grid grid-cols-3 gap-2 bg-blue-50 p-3 rounded border border-blue-200 mt-2">
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 1 *</label>
                        <input type="number" step="0.01" id="r1" class="reading-input w-full border-2 border-gray-300 p-2 rounded" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 2</label>
                        <input type="number" step="0.01" id="r2" placeholder="Optional" class="reading-input w-full border-2 border-gray-300 p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-900 mb-1">Reading 3</label>
                        <input type="number" step="0.01" id="r3" placeholder="Optional" class="reading-input w-full border-2 border-gray-300 p-2 rounded">
                    </div>
                </div>

                <div class="md:col-span-2 p-3 rounded text-center font-black text-xl bg-gray-200 text-gray-600 transition" id="resultBox">
                    STATUS: <span id="resultVal">WAITING</span>
                </div>

                <div class="md:col-span-2 mt-2">
                    <button type="submit" id="submitAuditBtn" class="w-full bg-blue-700 text-white font-black text-lg px-8 py-4 rounded shadow hover:bg-blue-800 transition">Save Torque Audit</button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 border-t-8 border-red-800">
            <h2 class="text-xl font-black text-gray-800 mb-4 uppercase border-b pb-2">Observation & Action Plan</h2>
            
            <form id="obsForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Observation (What failed?)</label>
                    <input type="text" id="obsText" placeholder="e.g., RH Head light Bolt torque less 85... 90" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Action Taken</label>
                    <input type="text" id="actionText" placeholder="e.g., Awareness given to stage TM to fix proper gun shutoff" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Status</label>
                    <select id="obsStatus" class="w-full border-2 border-gray-300 p-2 rounded">
                        <option value="Closed">Closed</option>
                        <option value="Open">Open</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Manager Signature / Name</label>
                    <input type="text" id="managerName" placeholder="Manager Name" class="w-full border-2 border-gray-300 p-2 rounded" required>
                </div>

                <div class="md:col-span-2 mt-2">
                    <button type="submit" id="submitObsBtn" class="w-full bg-red-700 text-white font-black text-lg px-8 py-4 rounded shadow hover:bg-red-800 transition">Save Observation</button>
                </div>
            </form>
        </div>

    </main>

    <script>
        // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbwjFvkYgMjHfqifJwOx-S3Q2vxz9npR3DafwZELAXa8kTMntqPVA7SKkfElz7XGBl2c/exec";
        let partMasterData = {};

        // Auto-fill current date/time on page load but allow editing
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('dateTime').value = now.toISOString().slice(0,16);

        // Fetch Master Parts
        async function fetchMasterParts() {
            if(API_URL === "YOUR_DEPLOYED_WEB_APP_URL_HERE") return;
            try {
                const response = await fetch(API_URL);
                partMasterData = await response.json();
            } catch (e) { console.error("Fetch failed", e); }
        }
        fetchMasterParts();

        // Part fetch button
        document.getElementById('fetchPart').addEventListener('click', () => {
            const code = document.getElementById('partCode').value.toUpperCase().trim();
            const record = partMasterData[code];
            if (record) {
                document.getElementById('partName').value = record.name;
                document.getElementById('specMin').value = record.min;
                document.getElementById('specMax').value = record.max;
                runEvaluation();
            } else {
                alert("Code not found in database. You can type it manually.");
            }
        });

        // Evaluation Logic (Ignores empty R2 and R3)
        const inputs = document.querySelectorAll('.reading-input');
        inputs.forEach(elm => elm.addEventListener('input', runEvaluation));

        function runEvaluation() {
            const min = parseFloat(document.getElementById('specMin').value);
            const max = parseFloat(document.getElementById('specMax').value);
            const r1 = parseFloat(document.getElementById('r1').value);
            const r2Val = document.getElementById('r2').value;
            const r3Val = document.getElementById('r3').value;

            const box = document.getElementById('resultBox');
            const output = document.getElementById('resultVal');

            if (isNaN(min) || isNaN(max) || isNaN(r1)) {
                box.className = "md:col-span-2 p-3 rounded text-center font-black text-xl bg-gray-200 text-gray-600";
                output.innerText = "WAITING";
                return "";
            }

            let isOk = (r1 >= min && r1 <= max);
            if (r2Val !== "" && isOk) { isOk = (parseFloat(r2Val) >= min && parseFloat(r2Val) <= max); }
            if (r3Val !== "" && isOk) { isOk = (parseFloat(r3Val) >= min && parseFloat(r3Val) <= max); }

            if (isOk) {
                box.className = "md:col-span-2 p-3 rounded text-center font-black text-xl bg-green-500 text-white";
                output.innerText = "OK";
                return "OK";
            } else {
                box.className = "md:col-span-2 p-3 rounded text-center font-black text-xl bg-red-600 text-white";
                output.innerText = "NG (FAIL)";
                return "NG";
            }
        }

        // --- SUBMIT AUDIT DATA ---
        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const finalResult = runEvaluation();
            const btn = document.getElementById('submitAuditBtn');
            btn.innerText = "Saving..."; btn.disabled = true;

            const payload = {
                formType: "audit",
                dateTime: document.getElementById('dateTime').value,
                shift: document.getElementById('shift').value,
                line: document.getElementById('line').value,
                partCode: document.getElementById('partCode').value,
                partName: document.getElementById('partName').value,
                specMin: document.getElementById('specMin').value,
                specMax: document.getElementById('specMax').value,
                r1: document.getElementById('r1').value,
                r2: document.getElementById('r2').value || "-", // If empty, send a dash
                r3: document.getElementById('r3').value || "-", // If empty, send a dash
                result: finalResult,
                auditor: document.getElementById('auditor').value
            };

            // Using text/plain prevents the CORS block from Google
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if(data.status === "SUCCESS") {
                    alert("Audit Saved to Sheet!");
                    document.getElementById('partCode').value = '';
                    document.getElementById('partName').value = '';
                    document.getElementById('r1').value = '';
                    document.getElementById('r2').value = '';
                    document.getElementById('r3').value = '';
                    runEvaluation();
                } else {
                    alert("Error from Google: " + data.message);
                }
            } catch(err) {
                alert("Failed to connect to Google Sheets.");
            } finally {
                btn.innerText = "Save Torque Audit"; btn.disabled = false;
            }
        });

        // --- SUBMIT OBSERVATION DATA ---
        document.getElementById('obsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitObsBtn');
            btn.innerText = "Saving..."; btn.disabled = true;

            const payload = {
                formType: "observation",
                date: new Date().toLocaleDateString(),
                issue: document.getElementById('obsText').value,
                action: document.getElementById('actionText').value,
                status: document.getElementById('obsStatus').value,
                manager: document.getElementById('managerName').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if(data.status === "SUCCESS") {
                    alert("Observation Logged!");
                    document.getElementById('obsForm').reset();
                }
            } catch(err) {
                alert("Failed to connect.");
            } finally {
                btn.innerText = "Save Observation"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
